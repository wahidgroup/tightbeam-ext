# cargo-audit configuration (consumed by `make audit`).
#
# Advisories listed here are acknowledged but suppressed, because each listed
# advisory has no fix that this dependency graph can take. Each entry MUST
# carry a justification and be revisited when an upstream fix ships.

[advisories]
ignore = [
	# paste: crate is archived as there is nothing further to do.
	"RUSTSEC-2024-0436",

	# crypto-bigint 0.5.5: timing variability in operations meant to run in
	# constant time. Pulled transitively by elliptic-curve through tightbeam-rs.
	# The fixed release needs the RustCrypto line built on der 0.8, and cms
	# still uses der 0.7. tightbeam accepts this advisory in its SECURITY.md.
	"RUSTSEC-2026-0387",
]

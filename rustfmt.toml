# The Rust format of the repo, which `make lint` checks.

hard_tabs = true
tab_spaces = 4
max_width = 120

# Max sets each width heuristic to max_width, and the widths below override seven of them.
use_small_heuristics = "Max"

fn_call_width = 80        # The arguments of a function call
array_width = 80          # An array literal
attr_fn_like_width = 80   # The arguments of a function-like attribute
struct_lit_width = 80     # The body of a struct literal
struct_variant_width = 80 # The body of a struct variant
chain_width = 80          # A method chain

# An if-else expression always breaks over lines.
single_line_if_else_max_width = 0

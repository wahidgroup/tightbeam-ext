[package]
name = "tightbeam-store"
description = "A driver-agnostic store of tightbeam frames, typed by message and queried by frame metadata"
authors.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tightbeam-store"
readme = "README.md"
keywords = ["storage", "repository", "database", "tightbeam", "der"]
categories = ["database", "data-structures"]

[lib]
name = "tightbeam_store"

[features]
testing = ["dep:tokio"]

[dependencies]
tightbeam-store-derive = { version = "0.1.0", path = "../tightbeam-store-derive" }
tightbeam-rs = { workspace = true, features = ["std"] }
tokio = { workspace = true, optional = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tightbeam-store = { path = ".", features = ["testing"] }
der = { workspace = true, features = ["alloc", "derive"] }
tightbeam-rs = { workspace = true, features = ["std", "testing", "tokio", "transport-hpke"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true

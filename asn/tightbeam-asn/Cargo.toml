[package]
name = "tightbeam-asn"
description = "DER-backed ASN.1 codec bridge for TypeScript MessageCodec façades"
authors.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tightbeam-asn"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "tightbeam_asn"

[[bin]]
name = "tightbeam-asn-emit"
path = "src/bin/tightbeam-asn-emit.rs"
required-features = ["emit"]

[[test]]
name = "emit_fixture"
path = "tests/emit_fixture.rs"
required-features = ["emit"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
emit = ["dep:tightbeam-derive"]

[dependencies]
tightbeam-asn-derive = { version = "0.1.0", path = "../tightbeam-asn-derive" }
tightbeam-derive = { version = "0.1.7", optional = true }
der = { workspace = true, features = ["alloc", "derive", "oid"] }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
tightbeam-asn-derive = { path = "../tightbeam-asn-derive" }
tightbeam-asn-fixtures = { path = "../tightbeam-asn-fixtures", features = ["wasm"] }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-test = "0.3"

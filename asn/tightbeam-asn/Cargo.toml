[package]
name = "tightbeam-asn"
description = "DER-backed ASN.1 codec bridge for TypeScript MessageCodec façades"
authors.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tightbeam-asn"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "tightbeam_asn"

[[bin]]
name = "tightbeam-asn-emit"
path = "src/bin/tightbeam-asn-emit.rs"
required-features = ["emit"]

[[test]]
name = "emit"
path = "tests/emit.rs"
required-features = ["emit"]

[[example]]
name = "fixture_package"
crate-type = ["cdylib"]

[features]
default = []
emit = ["dep:tightbeam-rs", "dep:tightbeam-asn-names"]

[dependencies]
tightbeam-asn-derive = { version = "0.1.0", path = "../tightbeam-asn-derive" }
tightbeam-asn-names = { version = "0.1.0", path = "../tightbeam-asn-names", optional = true }
tightbeam-rs = { workspace = true, optional = true }
der = { workspace = true, features = ["alloc", "derive", "oid"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }

[dev-dependencies]
tightbeam-asn-derive = { path = "../tightbeam-asn-derive" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

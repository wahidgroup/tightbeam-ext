[package]
name = "tightbeam-asn-fixtures"
description = "Fixture wire types for tightbeam-asn tests"
publish = false
authors.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "tightbeam_asn_fixtures"

[features]
default = []
wasm = ["tightbeam-asn/wasm", "dep:wasm-bindgen"]

[dependencies]
der = { workspace = true, features = ["alloc", "derive", "oid"] }
tightbeam-asn = { path = "../tightbeam-asn" }
wasm-bindgen = { workspace = true, optional = true }

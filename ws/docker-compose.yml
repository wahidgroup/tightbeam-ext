# The ws services of the e2e stack, as docs/ws.md (Demo servers) states them.

services:
  echo-server-mux:
    image: ${ECHO_IMAGE:?}
    environment:
      ECHO_WS_PORT: &echo-mux-port 9100
      MUX_STREAMS: "${MUX_STREAMS:?}"
      TBWS_SERVER_CERT: /certs/server.cert.der
    volumes:
      - ${CERT_DIR:?}:/certs:ro
    ports:
      - target: *echo-mux-port
        published: "${ECHO_WS_MUX_HOST_PORT:?}"

  echo-server-mux-clear:
    image: ${ECHO_IMAGE:?}
    command: ["echo-server-mux-clear"]
    environment:
      ECHO_WS_PORT: &echo-mux-clear-port 9101
      MUX_STREAMS: "${MUX_STREAMS:?}"
    ports:
      - target: *echo-mux-clear-port
        published: "${ECHO_WS_MUX_CLEAR_HOST_PORT:?}"

  echo-server-mux-mutual:
    image: ${ECHO_IMAGE:?}
    environment:
      ECHO_WS_PORT: &echo-mux-mutual-port 9102
      MUX_STREAMS: "${MUX_STREAMS:?}"
      TBWS_SERVER_CERT: /certs/server.cert.der
      TBWS_CLIENT_CERT: /certs/client.cert.der
      TBWS_PAYWALL: "${TBWS_PAYWALL:?}"
      TBWS_DEMO_INVOICE: "${TBWS_DEMO_INVOICE:?}"
      TBWS_DEMO_PAYMENT: "${TBWS_DEMO_PAYMENT:?}"
      TBWS_MUX_BUDGET_C2S: "${TBWS_MUX_BUDGET_C2S:?}"
      TBWS_MUX_BUDGET_S2C: "${TBWS_MUX_BUDGET_S2C:?}"
    volumes:
      - ${CERT_DIR:?}:/certs:ro
    ports:
      - target: *echo-mux-mutual-port
        published: "${ECHO_WS_MUX_MUTUAL_HOST_PORT:?}"

  # Cleartext duplex body echo for openDuplex e2e (TBWS_ECHO_BODY=duplex).
  echo-server-mux-duplex:
    image: ${ECHO_IMAGE:?}
    command: ["echo-server-mux-clear"]
    environment:
      ECHO_WS_PORT: &echo-mux-duplex-port 9103
      MUX_STREAMS: "${MUX_STREAMS:?}"
      TBWS_ECHO_BODY: duplex
    ports:
      - target: *echo-mux-duplex-port
        published: "${ECHO_WS_MUX_DUPLEX_HOST_PORT:?}"

  # Cluster work-plane gateway: a real gateway, hive, and probe servlet
  # in one process. The browser pins the server certificate for transport
  # encryption and shares the client identity as the end-to-end work signer.
  work-gateway:
    image: ${ECHO_IMAGE:?}
    command: ["work-gateway-server"]
    environment:
      ECHO_WS_PORT: &work-gateway-port 9104
      TBWS_SERVER_CERT: /certs/server.cert.der
      TBWS_WORK_CERT: /certs/client.cert.der
      TBWS_WORK_SERVLET: "${TBWS_WORK_SERVLET:?}"
    volumes:
      - ${CERT_DIR:?}:/certs:ro
    ports:
      - target: *work-gateway-port
        published: "${WORK_GATEWAY_WS_HOST_PORT:?}"

# Self-contained e2e stack: multiplexed tightbeam-ws echo servers
# (encrypted, cleartext, and mutual-auth encrypted) sharing one image.
#
# The image is built by scripts/stack.sh. Identity fixtures are generated on
# the host (gen_certs) and bind-mounted read-only under /certs. The demo
# stream cap and paywall facts come from scripts/stack-env.sh, and a missing
# one refuses to start the stack.

services:
  echo-server-mux:
    image: ${ECHO_IMAGE:-tightbeam-ws-echo:dev}
    environment:
      ECHO_WS_PORT: "9100"
      MUX_STREAMS: "${MUX_STREAMS:?}"
      TBWS_SERVER_CERT: /certs/server.cert.der
    volumes:
      - ${CERT_DIR:?}:/certs:ro
    ports:
      - "${ECHO_WS_MUX_HOST_PORT:-9100}:9100"

  echo-server-mux-clear:
    image: ${ECHO_IMAGE:-tightbeam-ws-echo:dev}
    command: ["echo-server-mux-clear"]
    environment:
      ECHO_WS_PORT: "9101"
      MUX_STREAMS: "${MUX_STREAMS:?}"
    ports:
      - "${ECHO_WS_MUX_CLEAR_HOST_PORT:-9101}:9101"

  echo-server-mux-mutual:
    image: ${ECHO_IMAGE:-tightbeam-ws-echo:dev}
    environment:
      ECHO_WS_PORT: "9102"
      MUX_STREAMS: "${MUX_STREAMS:?}"
      TBWS_SERVER_CERT: /certs/server.cert.der
      TBWS_CLIENT_CERT: /certs/client.cert.der
      TBWS_PAYWALL: "${TBWS_PAYWALL:?}"
      TBWS_DEMO_INVOICE: "${TBWS_DEMO_INVOICE:?}"
      TBWS_DEMO_PAYMENT: "${TBWS_DEMO_PAYMENT:?}"
      TBWS_MUX_BUDGET_C2S: "${TBWS_MUX_BUDGET_C2S:?}"
      TBWS_MUX_BUDGET_S2C: "${TBWS_MUX_BUDGET_S2C:?}"
    volumes:
      - ${CERT_DIR:?}:/certs:ro
    ports:
      - "${ECHO_WS_MUX_MUTUAL_HOST_PORT:-9102}:9102"

  # Cleartext duplex body echo for openDuplex e2e (TBWS_ECHO_BODY=duplex).
  echo-server-mux-duplex:
    image: ${ECHO_IMAGE:-tightbeam-ws-echo:dev}
    command: ["echo-server-mux-clear"]
    environment:
      ECHO_WS_PORT: "9103"
      MUX_STREAMS: "${MUX_STREAMS:?}"
      TBWS_ECHO_BODY: duplex
    ports:
      - "${ECHO_WS_MUX_DUPLEX_HOST_PORT:-9103}:9103"

  # Cluster work-plane gateway: a real gateway, hive, and work-probe servlet
  # in one process. The browser pins the server certificate for transport
  # encryption and shares the client identity as the end-to-end work signer.
  work-gateway:
    image: ${ECHO_IMAGE:-tightbeam-ws-echo:dev}
    command: ["work-gateway-server"]
    environment:
      ECHO_WS_PORT: "9104"
      TBWS_SERVER_CERT: /certs/server.cert.der
      TBWS_WORK_CERT: /certs/client.cert.der
    volumes:
      - ${CERT_DIR:?}:/certs:ro
    ports:
      - "${WORK_GATEWAY_WS_HOST_PORT:-9104}:9104"

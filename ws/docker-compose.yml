# Self-contained e2e stack: multiplexed tightbeam-ws echo servers
# (encrypted, cleartext, and mutual-auth encrypted) sharing one image.
#
# The image is built by scripts/stack.sh. Identity fixtures are generated on
# the host (gen_certs) and bind-mounted read-only under /certs.

services:
  echo-server-mux:
    image: ${ECHO_IMAGE:-tightbeam-ws-echo:dev}
    environment:
      ECHO_WS_PORT: "9100"
      TBWS_SERVER_CERT: /certs/server.cert.der
      TBWS_SERVER_KEY: /certs/server.key
    volumes:
      - ${CERT_DIR:?}:/certs:ro
    ports:
      - "${ECHO_WS_MUX_HOST_PORT:-9100}:9100"

  echo-server-mux-clear:
    image: ${ECHO_IMAGE:-tightbeam-ws-echo:dev}
    command: ["echo-server-mux-clear"]
    environment:
      ECHO_WS_PORT: "9101"
    ports:
      - "${ECHO_WS_MUX_CLEAR_HOST_PORT:-9101}:9101"

  echo-server-mux-mutual:
    image: ${ECHO_IMAGE:-tightbeam-ws-echo:dev}
    environment:
      ECHO_WS_PORT: "9102"
      TBWS_SERVER_CERT: /certs/server.cert.der
      TBWS_SERVER_KEY: /certs/server.key
      TBWS_CLIENT_CERT: /certs/client.cert.der
    volumes:
      - ${CERT_DIR:?}:/certs:ro
    ports:
      - "${ECHO_WS_MUX_MUTUAL_HOST_PORT:-9102}:9102"

[package]
name = "tightbeam-ws"
description = "WebSocket transport for the tightbeam messaging protocol"
authors.workspace = true
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "tightbeam_ws"

[features]
default = ["socket"]
# The tokio-tungstenite listener, dial, and stream.
socket = [
    "dep:tightbeam-wire",
    "dep:tokio",
    "tokio/net",
    "tokio/rt",
    "tokio/io-util",
    "tokio/macros",
    "tokio/sync",
    "tokio/time",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "tightbeam-rs/std",
    "tightbeam-rs/async-transport",
    "tightbeam-rs/tcp",
    "tightbeam-rs/tokio",
    "tightbeam-rs/transport-hpke",
    "tightbeam-rs/transport-multiplex",
    "tightbeam-rs/transport-policy",
]
# The owner of one accepted multiplexed connection: its transport gate, its
# tasks, and the handle a push-capable service emits on. It names no socket,
# so a transport-generic server such as tightbeam-pubsub depends on it alone.
serve = [
    "dep:tokio",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "tightbeam-rs/std",
    "tightbeam-rs/tokio",
    "tightbeam-rs/transport-hpke",
    "tightbeam-rs/transport-multiplex",
]
# The audit trail of a served link: the verdict of each call's gate and each
# answered keepalive probe, on the trace of the transport the link was
# accepted on.
instrument = ["tightbeam-rs/instrument"]
testing = ["socket", "serve", "instrument", "tightbeam-rs/testing"]
colony = ["testing", "dep:der", "tightbeam-rs/colony"]

[[example]]
name = "gen_certs"
required-features = ["testing"]

[[example]]
name = "echo_server_mux"
required-features = ["testing"]

[[example]]
name = "echo_server_mux_clear"
required-features = ["testing"]

[[example]]
name = "work_gateway_server"
required-features = ["colony"]

[dependencies]
tightbeam-rs = { workspace = true }
tightbeam-wire = { version = "0.1.0", path = "../../wire/tightbeam-wire", optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true, features = ["connect", "handshake"] }
futures-util = { workspace = true, optional = true, features = ["std", "sink"] }
# The der crate backs the Sequence derive of the colony work body, whose
# expansion references the crate by its absolute path.
der = { workspace = true, optional = true, features = ["alloc", "derive", "oid"] }

[dev-dependencies]
husky-rs = { workspace = true }
tightbeam-rs = { workspace = true, features = ["testing", "testing-csp", "testing-fault"] }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "test-util",
    "time",
] }

[lints]
workspace = true

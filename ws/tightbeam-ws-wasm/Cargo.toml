[package]
name = "tightbeam-ws-wasm"
description = "Browser (WebAssembly) WebSocket client for the tightbeam messaging protocol"
publish = false
authors.workspace = true
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "tightbeam_ws_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
tightbeam-rs = { workspace = true, features = [
	"std",
	"transport-hpke",
	"transport-multiplex",
	"async-transport",
	"wasm",
	"time",
	"aead",
	"colony-wire",
	"compress",
	"router",
] }
tightbeam-ws = { path = "../tightbeam-ws", default-features = false, features = ["wire"] }
der = { workspace = true, features = ["alloc", "derive", "oid"] }
ruzstd = { version = "=0.9.0", default-features = false, features = ["std", "hash"] }
gloo-net = { workspace = true, features = ["websocket"] }
futures-util = { workspace = true, features = ["std", "sink"] }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
	"AbortSignal",
	"AddEventListenerOptions",
	"CloseEvent",
	"Event",
	"EventTarget",
	"WebSocket",
] }

[dev-dependencies]
tightbeam-rs = { workspace = true, features = ["testing"] }
wasm-bindgen-test = "0.3"
web-sys = { workspace = true, features = ["AbortController"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tightbeam-rs = { workspace = true, features = ["testing", "zstd"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[package]
name = "tightbeam-ws-wasm"
description = "Browser (WebAssembly) WebSocket client for the tightbeam messaging protocol"
publish = false
authors.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
name = "tightbeam_ws_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
tightbeam-rs = { workspace = true, features = [
	"std",
	"transport-ecies",
	"async-transport",
	"wasm",
	"time",
	"aead",
] }
der = { workspace = true, features = ["alloc", "derive", "oid"] }
gloo-net = { workspace = true, features = ["websocket"] }
futures-util = { workspace = true, features = ["std", "sink"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
tightbeam-rs = { workspace = true, features = ["testing"] }
wasm-bindgen-test = "0.3"

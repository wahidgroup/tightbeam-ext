[package]
name = "tightbeam-pubsub"
description = "Topic pub/sub extension for the tightbeam messaging protocol"
authors.workspace = true
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tightbeam-pubsub"
readme = "README.md"
keywords = ["pubsub", "messaging", "protocol", "tightbeam", "topics"]
categories.workspace = true

[lib]
name = "tightbeam_pubsub"

[features]
# Test-support code builds frames a client would (including sealed
# bodies), so it needs tightbeam's AEAD surface. Its in-memory link runs no
# handshake, so it builds the served link from its parts.
testing = ["tightbeam-rs/aead", "tightbeam-ws/link-parts"]
# The audit trail of each served connection: its admission and departure, its
# expulsion, each refused command, and each dropped update, on the trace of
# the transport its link was accepted on.
instrument = ["tightbeam-rs/instrument", "tightbeam-ws/instrument"]

[[example]]
name = "pubsub_demo_server"
required-features = ["testing"]
test = true

[[example]]
name = "pubsub_processor_server"
required-features = ["testing"]

[dependencies]
tightbeam-rs = { workspace = true, features = [
	"std",
	"tokio",
	"transport-hpke",
	"transport-multiplex",
] }
der = { workspace = true, features = ["alloc", "derive", "oid"] }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
# The owner of one served connection, with no socket crate.
tightbeam-ws = { version = "0.5.0", path = "../../ws/tightbeam-ws", default-features = false, features = ["serve"] }

[dev-dependencies]
# Self dev-dependency: turns the `testing` feature and the audit trail on for
# every test and example build, so integration tests need no feature gate.
tightbeam-pubsub = { path = ".", features = ["testing", "instrument"] }
# The manual clock that drives a link in the deadline tests.
tightbeam-rs = { workspace = true, features = ["testing", "testing-csp"] }
husky-rs = { workspace = true }
tightbeam-ws = { version = "0.5.0", path = "../../ws/tightbeam-ws", features = ["testing"] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = [
	"rt-multi-thread",
	"macros",
	"sync",
	"time",
	"test-util",
] }

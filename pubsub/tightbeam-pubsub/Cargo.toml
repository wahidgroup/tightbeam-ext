[package]
name = "tightbeam-pubsub"
description = "Topic pub/sub extension for the tightbeam messaging protocol"
authors.workspace = true
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tightbeam-pubsub"
readme = "README.md"
keywords = ["pubsub", "messaging", "protocol", "tightbeam", "topics"]
categories.workspace = true

[lib]
name = "tightbeam_pubsub"

[features]
# The loopback WebSocket link and peer, and the backplane contract suite.
testing = ["instrument", "tightbeam-ws/socket"]
# The audit trail of each served connection.
instrument = ["tightbeam-rs/instrument", "tightbeam-ws/instrument"]

[[example]]
name = "pubsub_demo_server"
test = true

[[example]]
name = "wire_contract"
test = true

[dependencies]
tightbeam-rs = { workspace = true, features = [
	"std",
	"tokio",
	"transport-hpke",
	"transport-multiplex",
] }
der = { workspace = true, features = ["alloc", "derive", "oid"] }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
# The owner of one served connection, with no socket crate.
tightbeam-ws = { version = "0.5.0", path = "../../ws/tightbeam-ws", default-features = false, features = ["serve"] }

[dev-dependencies]
# Self dev-dependency: turns the `testing` feature on for every test and
# example build.
tightbeam-pubsub = { path = ".", features = ["testing"] }
# The manual clock of the deadline tests, and the cipher of a sealed body.
tightbeam-rs = { workspace = true, features = ["aead", "testing", "testing-csp"] }
husky-rs = { workspace = true }
tightbeam-ws = { version = "0.5.0", path = "../../ws/tightbeam-ws", features = ["testing"] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = [
	"rt-multi-thread",
	"macros",
	"sync",
	"time",
	"test-util",
] }

[lints]
workspace = true

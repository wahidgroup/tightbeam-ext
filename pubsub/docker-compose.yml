# Pubsub services, layered on ws/docker-compose.yml by scripts/stack.sh.
# Every service runs the echo image under the shared certificates in /certs.

# The stream cap and paywall of ws/scripts/stack-env.sh, which the relay dial
# and the processor share.
x-demo-config: &demo-config
  MUX_STREAMS: "${MUX_STREAMS:?}"
  TBWS_PAYWALL: "${TBWS_PAYWALL:?}"
  TBWS_DEMO_INVOICE: "${TBWS_DEMO_INVOICE:?}"
  TBWS_DEMO_PAYMENT: "${TBWS_DEMO_PAYMENT:?}"
  TBWS_MUX_BUDGET_C2S: "${TBWS_MUX_BUDGET_C2S:?}"
  TBWS_MUX_BUDGET_S2C: "${TBWS_MUX_BUDGET_S2C:?}"

services:
  pubsub-demo:
    image: ${ECHO_IMAGE:?}
    command: ["pubsub-demo-server"]
    environment:
      PUBSUB_WS_PORT: "${PUBSUB_WS_PORT:?}"
      PUBSUB_QUEUE_CAPACITY: "${PUBSUB_QUEUE_CAPACITY:?}"
      TBWS_SERVER_CERT: /certs/server.cert.der
      TBWS_CLIENT_CERT: /certs/client.cert.der
      <<: *demo-config
    volumes:
      - ${CERT_DIR:?}:/certs:ro
    ports:
      - target: ${PUBSUB_WS_PORT:?}
        published: "${PUBSUB_WS_HOST_PORT:?}"
    # The image healthcheck probes the echo port, so each service probes its
    # own port.
    healthcheck:
      test: ["CMD-SHELL", "ss -ltn \"sport = :$${PUBSUB_WS_PORT}\" | grep -q LISTEN || exit 1"]
      interval: 3s
      timeout: 2s
      start_period: 3s
      retries: 30

  # The payload processor servlet. It publishes no host port, and only the
  # processed demo server dials it, over the compose network.
  pubsub-processor:
    image: ${ECHO_IMAGE:?}
    command: ["pubsub-processor-server"]
    environment:
      PUBSUB_PROCESSOR_PORT: "${PUBSUB_PROCESSOR_PORT:?}"
      PUBSUB_TOPIC_KEY: "${PUBSUB_TOPIC_KEY:?}"
      PUBSUB_TOPIC_KEY_ID: "${PUBSUB_TOPIC_KEY_ID:?}"
      TBWS_SERVER_CERT: /certs/server.cert.der
      TBWS_CLIENT_CERT: /certs/client.cert.der
      <<: *demo-config
    volumes:
      - ${CERT_DIR:?}:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "ss -ltn \"sport = :$${PUBSUB_PROCESSOR_PORT}\" | grep -q LISTEN || exit 1"]
      interval: 3s
      timeout: 2s
      start_period: 3s
      retries: 30

  # A second demo server, which relays every publish through the processor
  # servlet.
  pubsub-demo-processed:
    image: ${ECHO_IMAGE:?}
    command: ["pubsub-demo-server"]
    environment:
      PUBSUB_WS_PORT: "${PUBSUB_WS_PORT:?}"
      PUBSUB_QUEUE_CAPACITY: "${PUBSUB_QUEUE_CAPACITY:?}"
      PUBSUB_PROCESSOR_ENDPOINT: "ws://pubsub-processor:${PUBSUB_PROCESSOR_PORT:?}"
      PUBSUB_PROCESSOR_CERT: /certs/server.cert.der
      TBWS_SERVER_CERT: /certs/server.cert.der
      TBWS_CLIENT_CERT: /certs/client.cert.der
      <<: *demo-config
    volumes:
      - ${CERT_DIR:?}:/certs:ro
    depends_on:
      pubsub-processor:
        condition: service_healthy
    ports:
      - target: ${PUBSUB_WS_PORT:?}
        published: "${PUBSUB_PROCESSED_WS_HOST_PORT:?}"
    healthcheck:
      test: ["CMD-SHELL", "ss -ltn \"sport = :$${PUBSUB_WS_PORT}\" | grep -q LISTEN || exit 1"]
      interval: 3s
      timeout: 2s
      start_period: 3s
      retries: 30

name: PR Checks

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  # The title and body jobs each run the file that holds their rule.
  title:
    name: Title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the title against the commit header rule
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          sh .husky/commit-msg "$RUNNER_TEMP/pr-title" title

  body:
    name: Body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the body against the PR template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: ./scripts/check-pr-body.sh

  metadata:
    name: Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Validate assignee and label
        env:
          ASSIGNEES_JSON: ${{ toJSON(github.event.pull_request.assignees) }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail

          assignee_count=$(printf '%s' "$ASSIGNEES_JSON" | jq 'length')
          label_count=$(printf '%s' "$LABELS_JSON" | jq 'length')

          failed=0
          if [ "$assignee_count" -eq 0 ]; then
            echo "PR MUST have at least one assignee."
            failed=1
          fi
          if [ "$label_count" -eq 0 ]; then
            echo "PR MUST have at least one label."
            failed=1
          fi
          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "See CONTRIBUTING.md for the PR requirements."
            exit 1
          fi
          echo "PR metadata OK: ${assignee_count} assignee(s), ${label_count} label(s)."

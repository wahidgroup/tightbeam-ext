name: Release

on:
  push:
    tags:
      - "releases/v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  NO_HUSKY_HOOKS: "1"

jobs:
  release:
    name: Publish & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ws/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@wahidgroup"

      - name: Setup
        run: make setup
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: CI
        run: make ci

      - name: Verify version matches tag
        run: |
          VERSION="${GITHUB_REF_NAME#releases/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          CURRENT=$(awk -F'"' '/^\[workspace\.package\]/{f=1;next} f&&/^\[/{f=0} f&&/^version/{print $2;exit}' Cargo.toml)
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "Cargo.toml [workspace.package] version (${CURRENT}) does not match tag (${VERSION})"
            echo "Bump the workspace on master via make release version=v${VERSION} before tagging."
            exit 1
          fi
          NPM_CURRENT=$(node -p "require('./ws/client/package.json').version")
          if [ "$NPM_CURRENT" != "$VERSION" ]; then
            echo "ws/client/package.json version (${NPM_CURRENT}) does not match tag (${VERSION})"
            echo "Bump the workspace on master via make release version=v${VERSION} before tagging."
            exit 1
          fi

      - name: Generate SBOM
        run: make sbom

      - name: Publish tightbeam-ws to crates.io
        run: cargo publish --package tightbeam-ws
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish client to GitHub Packages
        run: npm publish --workspace @wahidgroup/tightbeam-ws-client
        working-directory: ws
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: tightbeam-ws v${{ env.VERSION }}
          generate_release_notes: true
          files: ws/client/sbom.json

name: Release

on:
  push:
    tags:
      - "releases/*/v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  NO_HUSKY_HOOKS: "1"

jobs:
  release:
    name: Publish & Release
    runs-on: ubuntu-latest-l
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: "*/package-lock.json"
          registry-url: https://npm.pkg.github.com
          scope: "@wahidgroup"

      - name: Setup
        run: make setup
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: CI
        run: make ci

      - name: Verify version matches tag
        run: ./scripts/verify-release-tag.sh

      - name: Refuse yanked versions
        run: ./scripts/check-yanked.sh "$EXT"

      - name: Generate SBOM
        if: env.HAS_SBOM == 'true'
        run: make sbom "$EXT"

      - name: Publish crates to crates.io
        run: |
          set --
          for crate in $CRATES; do
            set -- "$@" -p "$crate"
          done
          cargo publish "$@"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish client to GitHub Packages
        if: env.HAS_NPM == 'true'
        run: npm publish --workspace "@wahidgroup/${{ env.CRATE }}-client"
        working-directory: ${{ env.EXT }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: env.HAS_SBOM != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ env.TITLE }}
          generate_release_notes: true

      - name: Create GitHub Release
        if: env.HAS_SBOM == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ env.TITLE }}
          generate_release_notes: true
          files: ${{ env.EXT }}/client/sbom.json

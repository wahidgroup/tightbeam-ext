name: Release

on:
  push:
    # The release_tag shape of scripts/lib/extension.sh, as a static glob.
    tags:
      - "releases/*/v*"

# Each job grants its own token: the build runs third-party install and build
# code, so it reads, and the publish writes but runs none of that code.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  NO_HUSKY_HOOKS: "1"

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest-l
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/node

      - name: Setup
        run: make setup
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: CI
        run: make ci

      - name: Verify version matches tag
        run: ./scripts/verify-release-tag.sh

      - name: Generate SBOM
        if: env.SBOM != ''
        run: make sbom "$EXT"

      - name: Package crates
        run: |
          set --
          for crate in $CRATES; do
            set -- "$@" -p "$crate"
          done
          cargo package "$@"

      # npm/ holds the client tarball, and $SBOM keeps its path in the repo.
      - name: Pack client
        if: env.NPM_CLIENT != ''
        run: |
          mkdir -p "$RUNNER_TEMP/release/npm"
          npm pack --workspace "$NPM_CLIENT" --pack-destination "$RUNNER_TEMP/release/npm"
        working-directory: ${{ env.EXT }}

      - name: Stage SBOM
        if: env.SBOM != ''
        run: install -D -m 644 "$SBOM" "$RUNNER_TEMP/release/$SBOM"

      - name: Upload release files
        if: env.NPM_CLIENT != ''
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  publish:
    name: Publish & Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify version matches tag
        run: ./scripts/verify-release-tag.sh

      - uses: actions/setup-node@v4
        if: env.NPM_CLIENT != ''
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@wahidgroup"

      - name: Download release files
        if: env.NPM_CLIENT != ''
        uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Publish crates to crates.io
        run: ./scripts/publish-release.sh crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish client to GitHub Packages
        if: env.NPM_CLIENT != ''
        run: ./scripts/publish-release.sh client "$RUNNER_TEMP"/release/npm/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ env.TITLE }}
          generate_release_notes: true
          files: ${{ env.SBOM != '' && format('{0}/release/{1}', runner.temp, env.SBOM) || '' }}

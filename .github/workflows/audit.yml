name: Security Audit

on:
  schedule:
    - cron: "0 8 * * 1"
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "rust-toolchain.toml"
      - "ws/package.json"
      - "ws/package-lock.json"
      - "ws/*/package.json"
  pull_request:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "rust-toolchain.toml"
      - "ws/package.json"
      - "ws/package-lock.json"
      - "ws/*/package.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  NO_HUSKY_HOOKS: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ws/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@wahidgroup"

      - name: Setup
        run: make setup NPM_INSTALL_FLAGS=--ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Security Audit
        run: make audit

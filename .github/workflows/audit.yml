name: Security Audit

on:
  schedule:
    - cron: "0 8 * * 1"
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "rust-toolchain.toml"
      - ".cargo/audit.toml"
      - "**/package.json"
      - "**/package-lock.json"
  pull_request:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "rust-toolchain.toml"
      - ".cargo/audit.toml"
      - "**/package.json"
      - "**/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  NO_HUSKY_HOOKS: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      NPM_INSTALL_FLAGS: --ignore-scripts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/node

      - name: Setup
        run: make setup
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Security Audit
        run: make audit

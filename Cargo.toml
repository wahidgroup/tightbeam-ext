[workspace]
resolver = "2"
members = ["tightbeam-ws", "tightbeam-ws-wasm"]

[workspace.package]
authors = ["Tanveer Wahid <tan@wahid.email>"]
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wahidgroup/tightbeam-ws"
homepage = "https://github.com/wahidgroup/tightbeam-ws"
documentation = "https://docs.rs/tightbeam-ws"
readme = "README.md"
keywords = ["websocket", "transport", "messaging", "protocol", "tightbeam"]
categories = ["network-programming", "asynchronous"]

[workspace.dependencies]
tightbeam-rs = { version = "0.8.0", default-features = false, features = [
	"tcp",
	"tokio",
	"transport-ecies",
] }
tokio = { version = "1.50.0", default-features = false }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
	"connect",
	"handshake",
] }
futures-util = { version = "0.3.32", default-features = false, features = [
	"std",
	"sink",
] }

# Browser (wasm32) client dependencies.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.6", default-features = false, features = [
	"websocket",
] }

der = { version = "0.7", default-features = false, features = [
	"alloc",
	"derive",
	"oid",
] }

[profile.release]
lto = true

[workspace]
resolver = "2"
members = [
	"ws/tightbeam-ws",
	"ws/tightbeam-ws-wasm",
	"pubsub/tightbeam-pubsub",
	"mpc/tightbeam-mpc",
	"mpc/tightbeam-vm",
]

[workspace.package]
authors = ["Tanveer Wahid <tan@wahid.email>"]
edition = "2021"
rust-version = "1.85.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wahidgroup/tightbeam-ext"
homepage = "https://github.com/wahidgroup/tightbeam-ext"
documentation = "https://docs.rs/tightbeam-ws"
keywords = ["websocket", "transport", "messaging", "protocol", "tightbeam"]
categories = ["network-programming", "asynchronous"]

[workspace.dependencies]
tightbeam-rs = { version = "0.12.0", default-features = false }
tokio = { version = "1.53.1", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false }
futures-util = { version = "0.3.33", default-features = false }
serde_json = { version = "1.0.151", default-features = false }

# Browser (wasm32) client dependencies.
js-sys = "0.3.83"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.83", default-features = false }
gloo-net = { version = "0.7.0", default-features = false }

# Pinned to 0.7 to match the der version the RustCrypto stack is built against
der = { version = "0.7", default-features = false }

# MPC extension dependencies
stoffelnet = "0.1.0"
async-trait = "0.1.91"
ark-ff = { version = "0.5.0", default-features = false }

# MPC dev-dependencies
stoffelcrypto = "0.1.0"

# Share serialization for the tightbeam-vm bytecode layer
ark-serialize = { version = "0.5.0", default-features = false }
ark-bls12-381 = { version = "0.5.0", default-features = false, features = [
	"curve",
] }
ark-std = { version = "0.5.0", default-features = false }

# AFL binding for the tightbeam-vm program-decoder fuzz target
afl = "0.17.1"

# Git hooks manager
husky-rs = "0.4.0"

[profile.release]
lto = true

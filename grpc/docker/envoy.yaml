# Envoy in front of the grpc work gateway: an h2c hop that routes each tunnel
# by its :authority, configured to the hop requirements of docs/grpc.md.

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: tunnel
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: tunnel
                codec_type: HTTP2
                # A tunnel that runs no multiplexed keepalive stays silent up
                # to the 30-second operation timeout of its session.
                stream_idle_timeout: 300s
                route_config:
                  virtual_hosts:
                    - name: gateway
                      domains: ["localhost", "localhost:*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: grpc_gateway
                            # A route timeout would end the tunnel within its
                            # session, so the route sets none.
                            timeout: 0s
                    - name: unrouted
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response: { status: 404 }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: grpc_gateway
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: grpc_gateway
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      { address: grpc-work-gateway, port_value: 9120 }
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          # The gateway closes a connection that carries no tunnel at its
          # handshake timeout, 10 seconds by default, with no GOAWAY.
          common_http_protocol_options:
            idle_timeout: 5s
          # The gateway admits one stream per connection, and HTTP/2 refuses
          # a second one that arrives before its SETTINGS reach the hop.
          explicit_http_config:
            http2_protocol_options:
              max_concurrent_streams: 1
